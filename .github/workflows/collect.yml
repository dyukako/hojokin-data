name: J-Net21 収集

on:
  schedule:
    - cron: '30 20 * * *'   # 毎日 05:30 JST
  workflow_dispatch:
    inputs:
      seed:
        description: '初回の全件取得（true にすると掲載日の古いものまで全ページ読む）'
        default: 'false'
      refresh_days:
        description: '取得からこの日数を過ぎた記事を取り直す（0 で取り直さない）'
        default: '30'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 収集
        id: run
        continue-on-error: true
        run: |
          python collector/collect.py \
            --seed "${{ github.event.inputs.seed || 'false' }}" \
            --refresh-days "${{ github.event.inputs.refresh_days || '30' }}"

      - name: コミット（途中まででも残す）
        run: |
          git config user.name  'hojokin-bot'
          git config user.email 'hojokin-bot@users.noreply.github.com'
          git add -A articles index.json meta.json failed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "収集 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 失敗があればジョブを失敗にする（メール通知のため）
        if: steps.run.outcome == 'failure'
        run: |
          echo "収集スクリプトが失敗しました。failed.json と meta.json を確認してください。"
          cat failed.json 2>/dev/null || true
          exit 1
